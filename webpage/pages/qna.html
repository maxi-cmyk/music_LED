<div class="qna-page page-frame">
  <header class="demo-intro">
    <h1>Q&amp;A</h1>
    <div class="qna-tools">
      <label class="visually-hidden" for="qna-filter">Filter questions</label>
      <input id="qna-filter" class="qna-filter" type="search" placeholder="Filter questions" autocomplete="off">
      <button id="qna-collapse" class="secondary-button" type="button">Collapse all</button>
    </div>
  </header>
  <section id="qna-list" class="qna-list" aria-label="Questions and answers"></section>
  <p id="qna-empty" class="qna-empty" role="status" hidden>No question matches that filter.</p>
</div>
