<div class="demo-page page-frame">
  <h1 class="visually-hidden">Toy example</h1>

  <section class="sound-console" aria-labelledby="sound-console-title">
    <div class="sound-selection">
      <div class="section-heading"><h2 id="sound-console-title">Discrete frequencies</h2><p>Build a sound one frequency at a time.</p></div>
      <div id="frequency-list" class="frequency-list" aria-label="Individual frequency selection"></div>
      <div class="preset-heading"><strong>Quick combinations</strong></div>
      <div id="preset-list" class="preset-list" aria-label="Quick frequency combinations"></div>
    </div>
    <div class="transport-console">
      <div class="transport-state"><span>Selected sound</span><output id="selection-summary">Bass · 200 Hz</output></div>
      <label class="volume-control" for="volume-control"><span>Speaker volume</span><output id="volume-readout" for="volume-control">20%</output><input id="volume-control" type="range" min="0" max="100" step="1" value="20"></label>
      <div class="transport-buttons"><button id="play-button" class="primary-button" type="button">Play selected sound</button><button id="stop-button" class="secondary-button" type="button" disabled>Stop audio</button></div>
      <p id="audio-message" class="console-message" role="status" aria-live="polite">Ready. Playback starts only when you press Play.</p>
    </div>
    <div class="signal-composer" aria-labelledby="composer-title">
      <figure class="composer-plot">
        <figcaption>
          <div class="composer-heading"><h3 id="composer-title">Selected tones over 20 ms</h3><p>128 generated sample values · unitless</p></div>
          <div id="composer-legend" class="composer-legend" aria-label="Plot legend"></div>
        </figcaption>
        <canvas id="composite-canvas" width="1100" height="300" role="img" aria-label="Static plot of the selected tones and their combined signal over 128 samples"></canvas>
      </figure>
    </div>
  </section>
</div>
