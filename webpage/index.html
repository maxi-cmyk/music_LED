      OWN-WORLD: Charcoal instrument bench, phosphor signal yellow, direct RGB band fields, etched rules, and measurement-first typography.
      STORY: Choose sound, see bass/mids/treble become colour, then trace the same frame through a column vector, Fourier rows, and FFT reuse.
      FIRST VIEWPORT: Persistent instrument rail above a decisive page title, explicit colour legend, presets, transport, and live result. Play is the primary action.
