<div id="basis-projection">
  <h3>Projection and change of basis</h3>
  <div class="viz-controls"><label class="form-label" for="basis-angle">Basis angle <output id="basis-degrees">30°</output><input id="basis-angle" class="form-range" type="range" min="0" max="90" value="30"></label></div>
  <svg class="basis-diagram" role="img" aria-label="A fixed vector and its projections onto two rotating perpendicular basis directions"></svg>
  <div id="basis-result" class="tabular-nums" aria-live="polite"></div>
  <style>
    #basis-projection .basis-diagram{width:100%;height:280px;display:block}
    #basis-projection .basis-diagram text{fill:var(--foreground);font-size:12px}
  </style>
  <script>
  (()=>{
    const root=document.getElementById('basis-projection'),svg=root.querySelector('svg'),slider=root.querySelector('input'),out=root.querySelector('#basis-result');
    const ns='http://www.w3.org/2000/svg';
    const add=(tag,attrs)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));svg.append(e);return e;};
    function draw(){
      const w=root.clientWidth,h=280,s=Math.min(48,(w-90)/7),cx=w*.40,cy=185,a=+slider.value*Math.PI/180,u=[Math.cos(a),Math.sin(a)],v=[-Math.sin(a),Math.cos(a)],x=[2,1],c=2*u[0]+u[1],d=2*v[0]+v[1],p=u.map(z=>c*z),q=v.map(z=>d*z);
      svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      const P=z=>[cx+s*z[0],cy-s*z[1]];
      function line(z,t,color,dash=''){const b=P(z),e=P(t);add('line',{x1:b[0],y1:b[1],x2:e[0],y2:e[1],stroke:color,'stroke-width':dash?1:2,'stroke-dasharray':dash});}
      function arrow(z,color){line([0,0],z,color);const p=P(z),ang=Math.atan2(-z[1],z[0]);add('path',{d:`M${p[0]-8*Math.cos(ang-.4)},${p[1]-8*Math.sin(ang-.4)} L${p} L${p[0]-8*Math.cos(ang+.4)},${p[1]-8*Math.sin(ang+.4)}`,fill:'none',stroke:color,'stroke-width':2});}
      function label(z,t,dx=8,dy=-8){const p=P(z);add('text',{x:p[0]+dx,y:p[1]+dy}).textContent=t;}
      line(u.map(z=>-2*z),u.map(z=>3*z),'var(--border)');line(v.map(z=>-2*z),v.map(z=>3*z),'var(--border)');
      line(p,x,'var(--muted-foreground)','4 4');line(q,x,'var(--muted-foreground)','4 4');
      arrow(p,'var(--viz-series-1)');arrow(q,'var(--viz-series-2)');arrow(x,'var(--foreground)');
      label(x,'same vector x');label(u.map(z=>2.8*z),'basis 1');label(v.map(z=>2.8*z),'basis 2',8,2);label([0,0],'0',-14,16);
      out.textContent=`Coordinates in this basis: (${c.toFixed(2)}, ${d.toFixed(2)}) · Original coordinates: (2, 1)`;
      root.querySelector('#basis-degrees').textContent=slider.value+'°';
    }
    function restore(s){const z=s?.privateContent?.basisAngle;if(Number.isFinite(z))slider.value=z;draw();}
    slider.addEventListener('input',()=>{draw();window.openai?.setWidgetState?.({modelContent:{concept:'basis and projection',basisAngle:+slider.value},privateContent:{basisAngle:+slider.value}})?.catch(()=>{});});
    new ResizeObserver(draw).observe(root);restore(window.openai?.widgetState);
    window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  })();
  </script>
</div>
