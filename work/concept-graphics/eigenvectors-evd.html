<div id="eigenvectors-evd">
  <h3>Eigenvectors, eigenvalues, and EVD</h3>
  <div class="viz-controls"><label class="form-label" for="eigen-angle">Input direction <output id="eigen-degrees">30°</output><input id="eigen-angle" class="form-range" type="range" min="0" max="180" value="30"></label><button class="btn" type="button" data-angle="30">Eigenvector 1</button><button class="btn" type="button" data-angle="120">Eigenvector 2</button></div>
  <svg class="eigen-diagram" role="img" aria-label="An input vector before and after a symmetric linear transformation, with two eigenvector directions shown"></svg>
  <div id="eigen-result" class="tabular-nums" aria-live="polite"></div>
  <style>
    #eigenvectors-evd .eigen-diagram{width:100%;height:290px;display:block}
    #eigenvectors-evd .eigen-diagram text{fill:var(--foreground);font-size:12px}
  </style>
  <script>
  (()=>{
    const root=document.getElementById('eigenvectors-evd'),svg=root.querySelector('svg'),slider=root.querySelector('input'),out=root.querySelector('#eigen-result'),ns='http://www.w3.org/2000/svg',a=Math.PI/6,u=[Math.cos(a),Math.sin(a)],v=[-Math.sin(a),Math.cos(a)];
    const add=(t,attrs,text)=>{const e=document.createElementNS(ns,t);Object.entries(attrs).forEach(([k,z])=>e.setAttribute(k,z));if(text)e.textContent=text;svg.append(e);return e;};
    function draw(){
      const w=root.clientWidth,s=Math.min(49,(w-70)/5.5),cx=w/2,cy=185,b=+slider.value*Math.PI/180,x=[Math.cos(b),Math.sin(b)],c=x[0]*u[0]+x[1]*u[1],d=x[0]*v[0]+x[1]*v[1],y=u.map((z,i)=>2*c*z+.5*d*v[i]);
      svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} 290`);
      const P=z=>[cx+s*z[0],cy-s*z[1]];
      function line(z,t,col,dash=''){const p=P(z),q=P(t);add('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:col,'stroke-width':dash?1:2,'stroke-dasharray':dash});}
      const label=(z,t,dx=8,dy=-8)=>{const p=P(z);add('text',{x:p[0]+dx,y:p[1]+dy},t);};
      line(u.map(z=>-2.3*z),u.map(z=>2.3*z),'var(--border)');line(v.map(z=>-2.1*z),v.map(z=>2.1*z),'var(--border)');
      const p=u.map(z=>2*c*z),q=v.map(z=>.5*d*z);
      line(p,y,'var(--muted-foreground)','4 4');line(q,y,'var(--muted-foreground)','4 4');
      line([0,0],p,'var(--viz-series-1)');line([0,0],q,'var(--viz-series-2)');line([0,0],x,'var(--muted-foreground)','4 4');line([0,0],y,'var(--foreground)');
      for(const [z,col] of [[x,'var(--muted-foreground)'],[y,'var(--foreground)']]){const p=P(z);add('circle',{cx:p[0],cy:p[1],r:4,fill:col});}
      label(x,'input x',8,18);label(y,'output Ax',8,-9);label(u.map(z=>2.4*z),'×2',-7,-4);label(v.map(z=>2.2*z),'×0.5',-10,-7);
      root.querySelector('#eigen-degrees').textContent=slider.value+'°';
      const eigen=Math.abs(c)<1e-8||Math.abs(d)<1e-8;
      out.textContent=eigen?`Eigenvector: same direction, length multiplied by ${Math.abs(d)<1e-8?'2':'0.5'}.`:'General vector: resolve along eigenvectors → scale by 2 and 0.5 → recombine.';
    }
    function changed(){draw();window.openai?.setWidgetState?.({modelContent:{concept:'eigenvectors and EVD',inputAngle:+slider.value},privateContent:{eigenAngle:+slider.value}})?.catch(()=>{});}
    slider.addEventListener('input',changed);root.querySelectorAll('button').forEach(b=>b.onclick=()=>{slider.value=b.dataset.angle;changed();});
    function restore(s){const z=s?.privateContent?.eigenAngle;if(Number.isFinite(z))slider.value=z;draw();}
    new ResizeObserver(draw).observe(root);restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  })();
  </script>
</div>
