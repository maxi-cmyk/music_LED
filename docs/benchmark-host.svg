<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">Provisional host DFT and FFT benchmark</title>
  <desc id="description">Grouped bars compare median direct DFT and FFT execution time for 32, 64, 128, and 256 samples on the development computer.</desc>
  <rect width="960" height="560" fill="#f6f1e7"/>
  <text x="74" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#171512">Provisional host benchmark</text>
  <text x="74" y="82" font-family="Arial, sans-serif" font-size="15" fill="#5c554b">Median of 9 timed runs after warm-up · C++20 -O2 · replace with ESP32 results</text>
  <line x1="92" y1="458" x2="900" y2="458" stroke="#171512" stroke-width="2"/>
  <line x1="92" y1="112" x2="92" y2="458" stroke="#171512" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#5c554b">
    <text x="50" y="463">0</text><text x="32" y="377">175</text><text x="32" y="290">350</text><text x="32" y="204">525</text><text x="32" y="117">700</text>
    <text x="184" y="486">32</text><text x="378" y="486">64</text><text x="568" y="486">128</text><text x="762" y="486">256</text>
    <text x="420" y="528" font-size="15">Sample count N</text>
    <text transform="translate(18 365) rotate(-90)" font-size="15">Median transform time (µs)</text>
  </g>
  <g stroke="#d5cbbc" stroke-width="1">
    <line x1="92" y1="371.5" x2="900" y2="371.5"/><line x1="92" y1="285" x2="900" y2="285"/><line x1="92" y1="198.5" x2="900" y2="198.5"/><line x1="92" y1="112" x2="900" y2="112"/>
  </g>
  <g fill="#b53b2d">
    <rect x="157" y="453.7" width="42" height="4.3"/><rect x="351" y="438.6" width="42" height="19.4"/><rect x="541" y="370.0" width="42" height="88.0"/><rect x="735" y="114.5" width="42" height="343.5"/>
  </g>
  <g fill="#225f73">
    <rect x="205" y="457.2" width="42" height="0.8"/><rect x="399" y="457.0" width="42" height="1.0"/><rect x="589" y="456.0" width="42" height="2.0"/><rect x="783" y="455.7" width="42" height="2.3"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#171512">
    <rect x="660" y="62" width="16" height="16" fill="#b53b2d"/><text x="684" y="75">Direct DFT</text>
    <rect x="778" y="62" width="16" height="16" fill="#225f73"/><text x="802" y="75">FFT</text>
  </g>
</svg>
